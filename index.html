
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#050914">
<title>JARVIS | Assistente</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  min-height: 100vh;
  background: radial-gradient(circle at 50% 30%, #102d4b, #050914 65%);
  color: #dff7ff;
  font-family: Arial, sans-serif;
  display: flex;
  justify-content: center;
}
.app {
  width: 100%;
  max-width: 500px;
  min-height: 100vh;
  padding: 28px 20px;
  display: flex;
  flex-direction: column;
}
header {
  text-align: center;
  letter-spacing: 5px;
  font-size: 12px;
  color: #5ce8ff;
}
h1 {
  font-size: 30px;
  letter-spacing: 8px;
  text-align: center;
  margin: 12px 0 5px;
}
.subtitle {
  text-align: center;
  color: #85a9c2;
  font-size: 13px;
}
.core {
  width: 180px;
  height: 180px;
  border: 2px solid #39dfff;
  border-radius: 50%;
  margin: 45px auto 25px;
  display: grid;
  place-items: center;
  box-shadow: 0 0 18px #00bfff55,
              inset 0 0 25px #00bfff33;
  position: relative;
  animation: pulse 3s infinite ease-in-out;
}
.core::before, .core::after {
  content: "";
  position: absolute;
  border: 1px dashed #39dfff99;
  border-radius: 50%;
}
.core::before { inset: 12px; }
.core::after { inset: -12px; }
.arc {
  width: 105px;
  height: 105px;
  border: 5px solid transparent;
  border-top-color: #80f4ff;
  border-bottom-color: #178dff;
  border-radius: 50%;
  animation: spin 5s linear infinite;
  display: grid;
  place-items: center;
}
.arc span {
  font-size: 28px;
  color: #a5f7ff;
}
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes pulse {
  50% { box-shadow: 0 0 35px #00bfff88,
                       inset 0 0 35px #00bfff55; }
}
.status {
  text-align: center;
  color: #65eaff;
  font-size: 12px;
  letter-spacing: 3px;
  margin-bottom: 25px;
}
.panel {
  border: 1px solid #1c5675;
  background: #061321cc;
  border-radius: 14px;
  padding: 15px;
}
.label {
  color: #52dfff;
  font-size: 11px;
  letter-spacing: 2px;
  margin-bottom: 10px;
}
#messages {
  min-height: 75px;
  max-height: 190px;
  overflow-y: auto;
  font-size: 14px;
  line-height: 1.6;
  white-space: pre-wrap;
}
.controls {
  display: flex;
  gap: 8px;
  margin-top: 12px;
}
input {
  min-width: 0;
  flex: 1;
  color: white;
  background: #0a1d2d;
  border: 1px solid #20516b;
  border-radius: 9px;
  padding: 12px;
  font-size: 14px;
}
button {
  color: #06111b;
  background: #51e5ff;
  border: 0;
  border-radius: 9px;
  padding: 12px;
  font-weight: bold;
}
.actions {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  margin-top: 14px;
}
.actions button {
  color: #8beeff;
  background: #0a1e30;
  border: 1px solid #1d607c;
}
footer {
  text-align: center;
  color: #54758b;
  font-size: 10px;
  margin-top: auto;
  padding-top: 30px;
}
</style>
</head>
<body>
<main class="app">
  <header>STARK INDUSTRIES • SYSTEM 001</header>
  <h1>J.A.R.V.I.S.</h1>
  <div class="subtitle">Just A Rather Very Intelligent System</div>

  <div class="core">
    <div class="arc"><span>J</span></div>
  </div>
  <div class="status" id="status">● SISTEMA ONLINE</div>

  <section class="panel">
    <div class="label">INTERFACE DE COMANDO</div>
    <div id="messages" aria-live="polite">JARVIS: Bom dia. Sistema inicializado. Como posso ajudar?</div>
    <form class="controls" id="chatForm">
      <input id="command" placeholder="Digite um comando..." autocomplete="off">
      <button type="submit">ENVIAR</button>
    </form>
    <div class="actions">
      <button type="button" id="hello">STATUS</button>
      <button type="button" id="clear">LIMPAR</button>
    </div>
  </section>

  <footer>JARVIS v0.1 • INTERFACE LOCAL • IA AINDA NÃO CONECTADA</footer>
</main>
<script>
const messages = document.getElementById("messages");
const input = document.getElementById("command");
const status = document.getElementById("status");

function reply(text) {
  messages.textContent += "\n\nVOCÊ: " + text;
  const q = text.toLowerCase();
  let answer;

  if (q.includes("seu nome") || q.includes("quem é você")) {
    answer = "Sou o JARVIS, seu assistente virtual em fase inicial.";
  } else if (q.includes("horas")) {
    answer = "Agora são " + new Date().toLocaleTimeString("pt-BR") + ".";
  } else if (q.includes("data")) {
    answer = "Hoje é " + new Date().toLocaleDateString("pt-BR") + ".";
  } else if (q.includes("olá") || q.includes("ola") || q.includes("oi")) {
    answer = "Olá! Estou pronto para receber seus comandos.";
  } else if (q.includes("status")) {
    answer = "Interface operacional. Módulo de inteligência artificial ainda não conectado.";
  } else {
    answer = "Recebi seu comando. Ainda estou aprendendo: minha IA será conectada na próxima etapa.";
  }

  messages.textContent += "\n\nJARVIS: " + answer;
  messages.scrollTop = messages.scrollHeight;
}

document.getElementById("chatForm").addEventListener("submit", function(e) {
  e.preventDefault();
  const text = input.value.trim();
  if (!text) return;
  reply(text);
  input.value = "";
});

document.getElementById("hello").addEventListener("click", function() {
  reply("status");
});

document.getElementById("clear").addEventListener("click", function() {
  messages.textContent = "JARVIS: Conversa limpa. Aguardando comando.";
});

</script>
</body>
</html>
